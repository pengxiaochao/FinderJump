# 主分支 / PR / 手动运行生成构建包；版本标签在双架构成功后自动发布。
name: 构建与发布 macOS 应用

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 发布 Release（必须选择与 Cargo 版本一致且已推送的 v 标签）
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  # 分支的新提交取消旧构建；标签发布串行，避免中途取消附件上传。
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: 校验架构、版本与发布条件
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          PUBLISH_REQUESTED: ${{ inputs.publish_release || false }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test -f Cargo.lock
          xcodebuild -version
          xcrun swift --version
          if [[ "$PUBLISH_REQUESTED" == true && -z "$RELEASE_TAG" ]]; then
            echo "::error::发布必须选择已存在的版本标签，不能选择分支。"
            exit 1
          fi
          python3 scripts/release-info.py

      - name: 缓存 Rust 下载依赖
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: 格式、静态检查与现有测试
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 tests/release-smoke.py

      - name: 构建、签名、压缩与校验
        run: bash scripts/package-macos.sh

      - name: 上传应用包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macOS-app-${{ matrix.arch }}
          path: |
            dist/FinderJump-*-macOS-${{ matrix.arch }}.zip
            dist/FinderJump-*-macOS-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: 发布 GitHub Release
    needs: build
    if: ${{ success() && github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish_release) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 获取发布脚本与说明
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 汇总本次运行的双架构应用包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macOS-app-*
          path: dist
          merge-multiple: true

      - name: 校验附件并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh dist
