[package]
name = "finder-jump"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A lightweight macOS Finder-to-terminal menu bar utility"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "7"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
async-channel = "2"
global-hotkey = "0.9.0"
libc = "0.2.191"
plist = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSRunningApplication"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
